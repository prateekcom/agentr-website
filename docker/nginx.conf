# Mirrors what CloudFront + S3 do in production:
#   /smarter-screening/  -> smarter-screening/index.html   (directory URL)
#   /missing/            -> 404.html with a 404 status
#   *.md served as text/markdown, llms.txt as text/plain
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/css text/plain text/markdown application/javascript application/json image/svg+xml;

    include /etc/nginx/mime.types;
    types { text/markdown md; }

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /llms.txt {
        default_type text/plain;
    }
}
