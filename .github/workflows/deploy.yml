---
name: Deploy Landing Site to CloudFront
on:
  push:
    branches: [ main ]
  workflow_dispatch:
  # Sanity calls this when a post is published or unpublished, so writing does not
  # wait on a developer. Setup: .github/SANITY-SETUP.md (kept under .github so it
  # is excluded from the S3 sync and never served publicly).
  repository_dispatch:
    types: [ sanity-publish ]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    env:
      BUCKET: agentr-prod-landing-page
      REGION: ap-south-1
      DIST_ID: E1PMBXZHPFWUET            # d3vqb912otkjbx.cloudfront.net

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # The blog is the one part of this site that is not committed as it ships:
    # posts live in Sanity and are rendered to /blog/<slug>/index.html here, so
    # the pages reaching S3 are still plain HTML with nothing to fetch at runtime.
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm

    # continue-on-error for the same reason the render step has it: before the
    # blog existed this workflow had no build step at all, so nothing could fail
    # ahead of the AWS steps. A registry blip must not stop a marketing change
    # from shipping. If the install fails the render fails too, and the /blog/
    # pages from the last good build are committed, so they publish again.
    #
    # --omit=dev because the drawing toolchain is not here any more: illustrations
    # are made in agentr-illustrations and stored in Sanity. What is left is what
    # build:blog actually needs — the Sanity client and the Portable Text renderer.
    - name: Install build dependencies
      continue-on-error: true
      run: npm ci --omit=dev

    # continue-on-error, deliberately: the blog must not be able to take the site
    # down. The script already returns cleanly when Sanity is unreachable; this
    # covers the other case, a post whose body will not render, which would
    # otherwise stop an unrelated marketing change from shipping. The /blog/ pages
    # from the last good build are committed, so a skipped render publishes them
    # again rather than nothing. The step shows as failed in Actions either way.
    - name: Render Sanity posts into /blog/
      continue-on-error: true
      env:
        # Only needed if the dataset is made private. Public datasets build
        # without it, and an unset secret is an empty string, which the script
        # treats as absent.
        SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}
      run: npm run build:blog

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.REGION }}

    # Every page is plain HTML by the time it gets here: what is committed, plus
    # the /blog/ pages the step above rendered. The build tooling itself must not
    # reach the bucket, hence the excludes. --delete means anything missed here
    # would be published, and anything wrongly excluded would be deleted.
    - name: Copy files to the bucket with the AWS CLI
      run: |
        aws s3 sync . s3://${{ env.BUCKET }} --delete \
          --exclude ".git/*" \
          --exclude ".github/*" \
          --exclude ".claude/*" \
          --exclude ".agents/*" \
          --exclude "node_modules/*" \
          --exclude "scripts/*" \
          --exclude "package.json" \
          --exclude "package-lock.json" \
          --exclude "skills-lock.json" \
          --exclude "irrelevent/*" \
          --exclude "docker/*" \
          --exclude ".gitignore" \
          --exclude ".DS_Store"

    # Every page is a separate index.html, so this cannot target one file the way
    # the React deploy does.
    # s-maxage lets CloudFront hold the page indefinitely while max-age=0 keeps
    # the browser revalidating, so a repeat visitor still gets the new build.
    # Staleness after a deploy is handled by the invalidation at the end of this
    # job, not by refusing to cache: no-store meant every request travelled to
    # ap-south-1 and the CDN did nothing for HTML at all.
    - name: Set HTML caching
      run: |
        aws s3 cp s3://${{ env.BUCKET }} s3://${{ env.BUCKET }} --recursive \
          --exclude "*" --include "*.html" \
          --metadata-directive REPLACE \
          --content-type "text/html; charset=utf-8" \
          --cache-control "public, max-age=0, s-maxage=31536000, must-revalidate"

    # CloudFront's S3 REST origin has no index-document concept: a request for
    # /smarter-screening/ asks for a key literally named "smarter-screening/",
    # which does not exist, so the origin 403s and the distribution's error
    # response serves the landing page instead. S3 does allow a key ending in a
    # slash, so write every page to that key as well and directory URLs resolve
    # at the origin. The bare key is written too, or /smarter-screening without
    # the slash falls through to the error response and serves the landing page.
    # Both forms carry the page's canonical tag, so search engines consolidate
    # them. The root needs no copy: it is the default root object.
    # A CloudFront Function rewriting the URI would be the tidier fix, but this
    # keeps the whole thing inside the deploy.
    - name: Publish directory URLs
      run: |
        find . -name index.html -not -path "./.git/*" -not -path "./.github/*" -not -path "./node_modules/*" -not -path "./irrelevent/*" -not -path "./docker/*" | while read -r f; do
          key="${f#./}"
          dir="${key%index.html}"
          if [ -n "$dir" ]; then
            for k in "$dir" "${dir%/}"; do
              aws s3api put-object \
                --bucket "${{ env.BUCKET }}" \
                --key "$k" \
                --body "$f" \
                --content-type "text/html; charset=utf-8" \
                --cache-control "public, max-age=0, s-maxage=31536000, must-revalidate"
            done
          fi
        done

    # site.css/site.js/landing.css/landing.js are not content-hashed, so they can
    # never be immutable: a deploy that changes them must reach people who already
    # hold a copy. Same policy as the HTML. Content-type is explicit because the
    # REPLACE directive rewrites all metadata and the responses carry
    # x-content-type-options: nosniff — a guessed type is a broken site.
    - name: Set CSS and JS caching
      run: |
        aws s3 cp s3://${{ env.BUCKET }} s3://${{ env.BUCKET }} --recursive \
          --exclude "*" --include "*.css" \
          --metadata-directive REPLACE \
          --content-type "text/css; charset=utf-8" \
          --cache-control "public, max-age=0, s-maxage=31536000, must-revalidate"
        aws s3 cp s3://${{ env.BUCKET }} s3://${{ env.BUCKET }} --recursive \
          --exclude "*" --include "*.js" \
          --metadata-directive REPLACE \
          --content-type "application/javascript; charset=utf-8" \
          --cache-control "public, max-age=0, s-maxage=31536000, must-revalidate"

    # llms.txt and *.md are read by agents and language-model crawlers; they get
    # the HTML cache policy (they change with the copy) and explicit types so a
    # markdown request is answered as markdown, not octet-stream.
    - name: Set markdown artifact types
      run: |
        aws s3 cp s3://${{ env.BUCKET }} s3://${{ env.BUCKET }} --recursive \
          --exclude "*" --include "*.md" \
          --metadata-directive REPLACE \
          --content-type "text/markdown; charset=utf-8" \
          --cache-control "public, max-age=0, s-maxage=31536000, must-revalidate"
        aws s3 cp s3://${{ env.BUCKET }}/llms.txt s3://${{ env.BUCKET }}/llms.txt \
          --metadata-directive REPLACE \
          --content-type "text/plain; charset=utf-8" \
          --cache-control "public, max-age=0, s-maxage=31536000, must-revalidate"

    # Images and icons are content-stable and never renamed in place.
    - name: Cache the images hard
      run: |
        aws s3 cp s3://${{ env.BUCKET }} s3://${{ env.BUCKET }} --recursive \
          --exclude "*" \
          --include "*.png" --include "*.ico" --include "*.jpg" \
          --include "*.jpeg" --include "*.webp" --include "*.svg" \
          --metadata-directive REPLACE \
          --cache-control "public, max-age=31536000, immutable"

    - name: Invalidate Cloudfront Cache
      run: |
        aws cloudfront create-invalidation \
          --distribution-id ${{ env.DIST_ID }} \
          --paths "/*"

    # The tests for a static site are its public endpoints. Any failure fails
    # the deploy loudly rather than shipping a silently broken machine surface.
    - name: Verify public endpoints
      run: |
        set -e
        BASE="https://d3vqb912otkjbx.cloudfront.net"
        fail=0
        check() {
          desc="$1"; want="$2"; got="$3"
          if [ "$got" = "$want" ]; then echo "ok   $desc"
          else echo "FAIL $desc: want [$want] got [$got]"; fail=1; fi
        }
        sleep 20   # give the invalidation a moment at the edge
        check "404 for a missing path" "404" \
          "$(curl -s -o /dev/null -w '%{http_code}' "$BASE/definitely-not-a-page/")"
        check "llms.txt served as text" "200 text/plain; charset=utf-8" \
          "$(curl -s -o /dev/null -w '%{http_code} %{content_type}' "$BASE/llms.txt")"
        check "index.md served as markdown" "200 text/markdown; charset=utf-8" \
          "$(curl -s -o /dev/null -w '%{http_code} %{content_type}' "$BASE/index.md")"
        check "stylesheet content-type" "text/css; charset=utf-8" \
          "$(curl -s -o /dev/null -w '%{content_type}' "$BASE/assets/landing.css")"
        check "landing script content-type" "application/javascript; charset=utf-8" \
          "$(curl -s -o /dev/null -w '%{content_type}' "$BASE/assets/landing.js")"
        curl -s "$BASE/" | grep -q "<h1" && echo "ok   homepage has an h1" \
          || { echo "FAIL homepage has no h1"; fail=1; }
        curl -s "$BASE/" | grep -q "Infinite" && echo "ok   h1 text survives extraction" \
          || { echo "FAIL h1 hidden text missing"; fail=1; }
        check "directory URL resolves" "200" \
          "$(curl -s -o /dev/null -w '%{http_code}' "$BASE/smarter-screening/")"
        check "blog index resolves" "200" \
          "$(curl -s -o /dev/null -w '%{http_code}' "$BASE/blog/")"
        # A blog that renders its posts at build time must not be shipping an
        # empty shell: if Sanity was unreachable the index would still be a valid
        # page, and only this catches it.
        curl -s "$BASE/blog/" | grep -q "Nothing published yet" \
          && echo "note blog index is empty (no published posts in Sanity)" \
          || echo "ok   blog index lists posts"
        exit $fail