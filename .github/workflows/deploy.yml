---
name: Deploy Landing Site to CloudFront
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    env:
      BUCKET: agentr-prod-landing-page
      REGION: ap-south-1
      DIST_ID: E1PMBXZHPFWUET

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.REGION }}

    - name: Copy files to the bucket
      run: |
        aws s3 sync . s3://${{ env.BUCKET }} --delete \
          --exclude ".git/*" \
          --exclude ".github/*" \
          --exclude ".claude/*" \
          --exclude ".gitignore" \
          --exclude ".DS_Store"

    - name: Set HTML caching
      run: |
        aws s3 cp s3://${{ env.BUCKET }} s3://${{ env.BUCKET }} --recursive \
          --exclude "*" --include "*.html" \
          --metadata-directive REPLACE \
          --content-type "text/html; charset=utf-8" \
          --cache-control "public, max-age=0, s-maxage=31536000, must-revalidate"

    - name: Publish directory URLs
      run: |
        find . -name index.html -not -path "./.git/*" -not -path "./.github/*" | while read -r f; do
          key="${f#./}"
          dir="${key%index.html}"
          if [ -n "$dir" ]; then
            for k in "$dir" "${dir%/}"; do
              aws s3api put-object \
                --bucket "${{ env.BUCKET }}" \
                --key "$k" \
                --body "$f" \
                --content-type "text/html; charset=utf-8" \
                --cache-control "public, max-age=0, s-maxage=31536000, must-revalidate"
            done
          fi
        done

    - name: Cache the images hard
      run: |
        aws s3 cp s3://${{ env.BUCKET }} s3://${{ env.BUCKET }} --recursive \
          --exclude "*" --include "*.png" --include "*.ico" \
          --metadata-directive REPLACE \
          --cache-control "public, max-age=31536000, immutable"

    - name: Wait for distribution to be deployable
      run: |
        aws cloudfront wait distribution-deployed --id ${{ env.DIST_ID }}

    - name: Point 403/404 errors at 404.html
      run: |
        CONFIG=$(aws cloudfront get-distribution \
          --id ${{ env.DIST_ID }} \
          --query 'Distribution' \
          --output json)
        ETAG=$(aws cloudfront get-distribution \
          --id ${{ env.DIST_ID }} \
          --query 'ETag' \
          --output text)

        UPDATED=$(echo "$CONFIG" | jq '
          .DistributionConfig.CustomErrorResponses = {
            "Quantity": 2,
            "Items": [
              {
                "ErrorCode": 403,
                "ResponsePagePath": "/404.html",
                "ResponseCode": 404,
                "ErrorCachingMinTTL": 300
              },
              {
                "ErrorCode": 404,
                "ResponsePagePath": "/404.html",
                "ResponseCode": 404,
                "ErrorCachingMinTTL": 300
              }
            ]
          }
        ')

        aws cloudfront update-distribution \
          --id ${{ env.DIST_ID }} \
          --distribution-config "$UPDATED" \
          --if-match "$ETAG" \
          --query 'Distribution.DomainName' \
          --output text

    - name: Invalidate CloudFront Cache
      run: |
        aws cloudfront create-invalidation \
          --distribution-id ${{ env.DIST_ID }} \
          --paths "/*"